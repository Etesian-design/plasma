// (first line of an autoconfig file is skipped)
// Test image only: does what the user's switch in Add-ons and Themes does, once Thunderbird is up: enable the Etesian theme.
Services.obs.addObserver(() => {
  const { AddonManager } = ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs");
  AddonManager.getAddonByID("theme@etesian-design.com").then((a) => a && a.enable());
}, "final-ui-startup");
